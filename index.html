<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>풍속 예보 (유성구)</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a30;
      --text: #eef3ff;
      --muted: #9aa7c7;
      --grid: rgba(255,255,255,.10);
      --avg: #7dd3fc;
      --max: #fca5a5;
      --line: rgba(255,255,255,.18);
      --day: rgba(255,255,255,.035);
      --midnight: rgba(255,255,255,.52);
      --pill: rgba(255,255,255,.12);
      --warn: #fbbf24;
      --axisw: 68px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #162242 0, var(--bg) 52%);
      color: var(--text);
    }
    main {
      width: min(1180px, calc(100vw - 28px));
      margin: 24px auto;
    }
    .top {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: clamp(21px, 3vw, 32px);
      letter-spacing: -0.03em;
      font-weight: 750;
    }
    .team-sub {
      color: var(--text);
      opacity: .82;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .02em;
      margin-top: 4px;
    }
    .sub {
      color: var(--muted);
      font-size: 13px;
      margin-top: 5px;
    }
    button {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.08);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 650;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: rgba(255,255,255,.13); }
    button:disabled { opacity: .55; cursor: wait; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .model-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(18,26,48,.72);
      color: var(--text);
      font-size: 13px;
      user-select: none;
      cursor: pointer;
    }
    .model-chip input {
      width: 16px;
      height: 16px;
      accent-color: #7dd3fc;
    }
    .model-chip.unavailable {
      opacity: .42;
      cursor: not-allowed;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .card {
      background: rgba(18,26,48,.82);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 18px 40px rgba(0,0,0,.22);
    }
    .label {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 7px;
    }
    .value {
      font-size: clamp(34px, 5vw, 52px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
    }
    .unit {
      font-size: .45em;
      color: var(--muted);
      margin-left: 5px;
      font-weight: 650;
    }
    .chart-wrap {
      background: rgba(18,26,48,.82);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 18px 40px rgba(0,0,0,.22);
      position: relative;
    }
    .chart-row {
      display: flex;
      align-items: stretch;
      min-width: 0;
    }
    .axis-box {
      flex: 0 0 var(--axisw);
      width: var(--axisw);
      height: 560px;
      border-right: 1px solid rgba(255,255,255,.13);
      background: rgba(18,26,48,.94);
      z-index: 2;
    }
    .scroll-box {
      flex: 1 1 auto;
      width: 100%;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 4px;
      scrollbar-color: rgba(255,255,255,.28) rgba(255,255,255,.06);
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      position: relative;
    }
    .floating-x-dates {
      position: absolute;
      left: var(--axisw);
      right: 14px;
      bottom: 58px;
      height: 26px;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }
    .floating-date {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(18,26,48,.94);
      border: 1px solid rgba(255,255,255,.25);
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      line-height: 16px;
      box-shadow: 0 5px 14px rgba(0,0,0,.28);
      white-space: nowrap;
    }
    canvas {
      display: block;
      height: 560px;
    }
    #axis {
      width: var(--axisw);
    }
    .legend {
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      margin: 10px 0 0;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
      margin-right: 6px;
      vertical-align: -1px;
    }
    .avg { background: var(--avg); }
    .max { background: var(--max); }
    .status {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      margin-top: 8px;
      min-height: 18px;
    }
    .status.warning { color: var(--warn); }

    .calm-label {
      position: absolute;
      left: calc(var(--axisw) + 16px);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      color: rgba(125,211,252,.55);
      pointer-events: none;
      z-index: 4;
    }

    #dailyReport {
      margin-top: 12px;
    }
    #dailyReport table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 13px;
      background: rgba(18,26,48,.82);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0,0,0,.22);
    }
    #dailyReport th {
      padding: 12px 16px;
      color: var(--muted);
      font-weight: 650;
      text-align: center;
      line-height: 1.3;
      white-space: normal;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.03);
    }
    #dailyReport td {
      padding: 11px 16px;
      text-align: center;
      line-height: 1.35;
      border-bottom: 1px solid rgba(255,255,255,.05);
    }
    #dailyReport tr:last-child td { border-bottom: none; }
    #dailyReport tr.today-row td {
      background: rgba(251,191,36,.09);
      color: #fde68a;
    }
    #dailyReport tr.today-row td.date-col {
      color: #fbbf24;
    }
    #dailyReport td.date-col { color: var(--text); font-weight: 700; text-align: left; }
    #dailyReport td.avg-col { color: var(--avg); }
    #dailyReport td.max-col { color: var(--max); }
    #dailyReport td.time-col { color: var(--muted); font-size: 12px; white-space: nowrap; }
    #dailyReport .rain-note {
      color: #fbbf24;
      font-weight: 700;
      margin-left: 4px;
    }
    #dailyReport th.time-head { white-space: nowrap; }
    #dailyReport th .head-break { display: block; }

    @media (max-width: 640px) {
      :root { --axisw: 56px; }
      main { width: min(100vw - 18px, 1180px); margin-top: 14px; }
      .top { align-items: start; flex-direction: column; }
      .cards { grid-template-columns: 1fr; }
      canvas, .axis-box { height: 460px; }
      button { width: 100%; }
      .controls { gap: 6px; }
      .model-chip { font-size: 12px; padding: 7px 9px; }
      .chart-wrap { padding: 10px; }
      .floating-x-dates { right: 10px; bottom: 36px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div>
        <h1 id="title">풍속 예보 (유성구)</h1>
        <div class="team-sub">For KAIST Team Soar Flight Tests</div>
        <div class="sub">10 m 기준 · 선택한 예보모델 집계 · m/s · 오른쪽 스크롤 가능</div>
      </div>
      <button id="refresh">새로고침</button>
    </div>

    <div id="controls" class="controls" aria-label="예보 모델 선택"></div>

    <section class="chart-wrap">
      <div id="calmLabel" class="calm-label">CALM</div>
      <div class="chart-row">
        <div class="axis-box">
          <canvas id="axis" aria-hidden="true"></canvas>
        </div>
        <div id="scrollBox" class="scroll-box">
          <canvas id="chart" aria-label="평균풍속과 최대풍속 그래프"></canvas>
        </div>
      </div>
      <div id="floatingDates" class="floating-x-dates" aria-hidden="true"></div>
      <div class="legend">
        <span><i class="dot avg"></i>평균풍속</span>
        <span><i class="dot max"></i>최대풍속</span>
      </div>
    </section>
    <div id="status" class="status"></div>
    <div id="dailyReport"></div>
  </main>

<script>
(() => {
  // 기본 위치: 충남대학교 대전캠퍼스 중심부 근처
  // 다른 위치로 쓰려면 URL 뒤에 ?lat=36.36997&lon=127.34789&name=충남대 처럼 붙이면 됩니다.
  // 예보 기간을 바꾸려면 ?days=3 처럼 붙이면 됩니다. 기본 7일, 최대 7일.
  const DEFAULT = { lat: 36.36997, lon: 127.34789, name: "충남대" };
  const params = new URLSearchParams(location.search);
  const POINT = {
    lat: Number(params.get("lat")) || DEFAULT.lat,
    lon: Number(params.get("lon")) || DEFAULT.lon,
    name: params.get("name") || DEFAULT.name
  };
  const DAYS = Math.min(7, Math.max(1, Number(params.get("days")) || 7));
  const HOURS_TO_SHOW = DAYS * 24;
  const STORAGE_KEY = `cnu-wind-selected-models-v2`;

  document.getElementById("title").textContent = "풍속 예보 (유성구)";

  const SOURCES = [
    // Best Match는 평균이 아니라 Open-Meteo가 위치별로 적절한 고해상도 모델을 선택/조합한 기본 예보입니다.
    { id: "best", name: "Best Match", url: "https://api.open-meteo.com/v1/forecast" },
    { id: "gfs",  name: "GFS",        url: "https://api.open-meteo.com/v1/gfs" },
    { id: "icon", name: "ICON",       url: "https://api.open-meteo.com/v1/dwd-icon" },
    { id: "ecmwf",name: "ECMWF",      url: "https://api.open-meteo.com/v1/ecmwf" }
  ];

  const dataCanvas = document.getElementById("chart");
  const axisCanvas = document.getElementById("axis");
  const ctx = dataCanvas.getContext("2d");
  const axisCtx = axisCanvas.getContext("2d");
  const scrollBox = document.getElementById("scrollBox");
  const floatingDatesEl = document.getElementById("floatingDates");
  const statusEl = document.getElementById("status");
  const avgNowEl = document.getElementById("avgNow");
  const maxNowEl = document.getElementById("maxNow");
  const controlsEl = document.getElementById("controls");

  let fetched = {};
  let availableIds = new Set();
  let selectedIds = loadSelectedIds();
  let lastRows = null;
  let lastYMax = 2;
  let firstLoad = true;

  initControls();

  function loadSelectedIds() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const ids = raw ? JSON.parse(raw) : null;
      if (Array.isArray(ids) && ids.length) return new Set(ids);
    } catch {}
    return new Set(["best"]);
  }

  function saveSelectedIds() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...selectedIds]));
    } catch {}
  }

  function initControls() {
    controlsEl.innerHTML = "";
    for (const source of SOURCES) {
      const label = document.createElement("label");
      label.className = "model-chip";
      label.id = `chip-${source.id}`;

      const input = document.createElement("input");
      input.type = "checkbox";
      input.checked = selectedIds.has(source.id);
      input.id = `model-${source.id}`;
      input.addEventListener("change", () => {
        if (input.checked) selectedIds.add(source.id);
        else selectedIds.delete(source.id);
        saveSelectedIds();
        renderFromSelection();
      });

      const span = document.createElement("span");
      span.textContent = source.name;

      label.appendChild(input);
      label.appendChild(span);
      controlsEl.appendChild(label);
    }
  }

  function qs(source) {
    const q = new URLSearchParams({
      latitude: POINT.lat,
      longitude: POINT.lon,
      hourly: "wind_speed_10m,wind_gusts_10m,precipitation",
      wind_speed_unit: "ms",
      timezone: "Asia/Seoul",
      forecast_days: String(DAYS),
      past_days: "1"
    });
    return `${source.url}?${q.toString()}`;
  }

  async function fetchSource(source) {
    const res = await fetch(qs(source), { cache: "no-store" });
    if (!res.ok) throw new Error(`${source.name}: HTTP ${res.status}`);
    const j = await res.json();
    if (j.error) throw new Error(`${source.name}: ${j.reason || "API error"}`);
    if (!j.hourly?.time || !j.hourly?.wind_speed_10m) {
      throw new Error(`${source.name}: wind data missing`);
    }
    return {
      id: source.id,
      name: source.name,
      times: j.hourly.time,
      speed: j.hourly.wind_speed_10m,
      gust: j.hourly.wind_gusts_10m || j.hourly.wind_speed_10m,
      precipitation: j.hourly.precipitation || []
    };
  }

  function roundHourKST(date = new Date()) {
    const d = new Date(date);
    d.setMinutes(0, 0, 0);
    return d;
  }

  function keyOfLocalHour(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    const h = String(date.getHours()).padStart(2, "0");
    return `${y}-${m}-${d}T${h}:00`;
  }

  function dateLabel(key) {
    const dt = new Date(key);
    const yoil = ["일", "월", "화", "수", "목", "금", "토"][dt.getDay()];
    return `${key.slice(5, 7)}/${key.slice(8, 10)}(${yoil})`;
  }

  function aggregate(results) {
    const nowHour = roundHourKST();
    const PAST_HOURS = 24;
    const startHour = new Date(nowHour);
    startHour.setHours(startHour.getHours() - PAST_HOURS);

    const hours = Array.from({ length: HOURS_TO_SHOW + PAST_HOURS }, (_, i) => {
      const d = new Date(startHour);
      d.setHours(d.getHours() + i);
      return keyOfLocalHour(d);
    });

    const nowKey = keyOfLocalHour(nowHour);

    const rows = hours.map(time => {
      const speeds = [];
      const gusts = [];
      const precipitations = [];
      const used = [];

      for (const r of results) {
        const idx = r.times.indexOf(time);
        if (idx >= 0) {
          const s = Number(r.speed[idx]);
          const g = Number(r.gust[idx]);
          const p = Number(r.precipitation?.[idx]);
          if (Number.isFinite(s)) speeds.push(s);
          if (Number.isFinite(g)) gusts.push(g);
          if (Number.isFinite(p)) precipitations.push(p);
          if (Number.isFinite(s) || Number.isFinite(g)) used.push(r.name);
        }
      }

      return {
        time,
        date: time.slice(0, 10),
        dateText: dateLabel(time),
        hour: Number(time.slice(11, 13)),
        isCurrent: time === nowKey,
        avg: speeds.length ? mean(speeds) : null,
        max: gusts.length ? Math.max(...gusts) : null,
        precip: precipitations.length ? Math.max(...precipitations) : 0,
        isRain: precipitations.some(v => v > 0),
        n: Math.max(speeds.length, gusts.length),
        used
      };
    }).filter(r => r.avg !== null || r.max !== null);

    return rows;
  }

  function mean(arr) {
    return arr.reduce((a, b) => a + b, 0) / arr.length;
  }

  function fmt(v) {
    return Number.isFinite(v) ? v.toFixed(1) : "--";
  }

  function getPlot() {
    const h = dataCanvas.getBoundingClientRect().height;
    return {
      top: 52,
      bottom: 78,
      height: Math.max(80, h - 52 - 78)
    };
  }

  function fitDataCanvas(rows) {
    const ratio = window.devicePixelRatio || 1;
    const visibleWidth = scrollBox.clientWidth || 800;
    const hourWidth = window.innerWidth < 640 ? 16 : 18;
    const cssWidth = Math.max(visibleWidth, rows.length * hourWidth + 34);
    dataCanvas.style.width = cssWidth + "px";

    const rect = dataCanvas.getBoundingClientRect();
    dataCanvas.width = Math.max(320, Math.floor(rect.width * ratio));
    dataCanvas.height = Math.max(300, Math.floor(rect.height * ratio));
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  }

  function fitAxisCanvas() {
    const ratio = window.devicePixelRatio || 1;
    const rect = axisCanvas.getBoundingClientRect();
    axisCanvas.width = Math.max(48, Math.floor(rect.width * ratio));
    axisCanvas.height = Math.max(300, Math.floor(rect.height * ratio));
    axisCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
  }

  function draw(rows) {
    fitDataCanvas(rows);
    fitAxisCanvas();

    const yMax = 10;
    lastYMax = yMax;

    drawAxis(yMax);
    drawData(rows, yMax);
  }

  function drawAxis(yMax) {
    const rect = axisCanvas.getBoundingClientRect();
    const W = rect.width;
    const H = rect.height;
    const plot = getPlot();
    const y = v => plot.top + plot.height - (Math.min(Math.max(v, 0), yMax) / yMax) * plot.height;

    axisCtx.clearRect(0, 0, W, H);

    // axis background
    axisCtx.fillStyle = "rgba(18,26,48,.96)";
    axisCtx.fillRect(0, 0, W, H);

    axisCtx.font = "12px system-ui, -apple-system, Segoe UI, sans-serif";
    axisCtx.strokeStyle = getCss("--grid");
    axisCtx.fillStyle = getCss("--muted");
    axisCtx.lineWidth = 1;

    const ticks = 10;
    axisCtx.textAlign = "right";
    axisCtx.textBaseline = "middle";
    for (let i = 0; i <= ticks; i++) {
      const v = yMax * i / ticks;
      const yy = y(v);
      axisCtx.beginPath();
      axisCtx.moveTo(W - 8, yy);
      axisCtx.lineTo(W, yy);
      axisCtx.stroke();
      axisCtx.fillText(v.toFixed(0), W - 12, yy);
    }

    axisCtx.save();
    axisCtx.fillStyle = getCss("--muted");
    axisCtx.textAlign = "center";
    axisCtx.textBaseline = "top";
    axisCtx.translate(12, plot.top + plot.height / 2);
    axisCtx.rotate(-Math.PI / 2);
    axisCtx.fillText("풍속 (m/s)", 0, 0);
    axisCtx.restore();

    // expose calmY for HTML label
    axisCanvas._calmY = y(5);
    updateCalmLabel();
  }

  function drawData(rows, yMax) {
    const rect = dataCanvas.getBoundingClientRect();
    const W = rect.width;
    const H = rect.height;
    const plot = getPlot();
    const padR = 28;
    const plotW = W - padR;
    const x = i => rows.length <= 1 ? 8 : 8 + ((plotW - 16) * i / (rows.length - 1));
    const y = v => plot.top + plot.height - (Math.min(Math.max(v, 0), yMax) / yMax) * plot.height;

    ctx.clearRect(0, 0, W, H);

    // calm zone background (0 ~ 5 m/s) — inside plot only
    const calmY = y(5);
    ctx.fillStyle = "rgba(125,211,252,.06)";
    ctx.fillRect(0, calmY, W - padR, plot.height - (calmY - plot.top));

    drawDayBands(rows, x, plot, W, H);

    ctx.font = "12px system-ui, -apple-system, Segoe UI, sans-serif";
    ctx.lineWidth = 1;

    // horizontal grid
    ctx.strokeStyle = getCss("--grid");
    const ticks = 10;
    for (let i = 0; i <= ticks; i++) {
      const v = yMax * i / ticks;
      const yy = y(v);
      ctx.beginPath();
      ctx.moveTo(0, yy);
      ctx.lineTo(W - padR, yy);
      ctx.stroke();
    }

    // vertical guide lines: strong at labeled ticks, faint otherwise
    ctx.lineWidth = 1;
    rows.forEach((r, i) => {
      const xx = x(i);
      const isLabeled = r.hour % 3 === 0;
      ctx.strokeStyle = isLabeled ? "rgba(255,255,255,.10)" : "rgba(255,255,255,.025)";
      ctx.beginPath();
      ctx.moveTo(xx, plot.top);
      ctx.lineTo(xx, plot.top + plot.height);
      ctx.stroke();

      if (isLabeled) {
        ctx.strokeStyle = getCss("--muted");
        ctx.beginPath();
        ctx.moveTo(xx, plot.top + plot.height);
        ctx.lineTo(xx, plot.top + plot.height + 5);
        ctx.stroke();
      }
    });

    // x labels: every 3 hours
    ctx.font = "11px system-ui, -apple-system, Segoe UI, sans-serif";
    ctx.textBaseline = "top";
    rows.forEach((r, i) => {
      if (r.hour % 3 !== 0) return;
      ctx.fillStyle = getCss("--muted");
      ctx.textAlign = "center";
      ctx.fillText(`${String(r.hour).padStart(2, "0")}시`, x(i), H - plot.bottom + 14);
    });

    let currentTagX = null;

    // (현재) vertical guide line
    {
      const currentIdx = rows.findIndex(r => r.isCurrent);
      const tagX = currentIdx >= 0 ? x(currentIdx) : x(0);
      currentTagX = tagX;

      ctx.save();
      ctx.strokeStyle = getCss("--avg");
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(tagX, plot.top);
      ctx.lineTo(tagX, plot.top + plot.height);
      ctx.stroke();
      ctx.restore();
    }

    ctx.font = "12px system-ui, -apple-system, Segoe UI, sans-serif";

    drawLine(rows, r => r.avg, getCss("--avg"), x, y, yMax);
    drawLine(rows, r => r.max, getCss("--max"), x, y, yMax);

    if (currentTagX !== null) {
      drawCurrentTags(currentTagX, plot, W, H, padR);
    }

  }

  function getDateGroups(rows, x, W) {
    if (!rows.length) return [];

    const groups = [];
    let start = 0;

    for (let i = 1; i <= rows.length; i++) {
      if (i === rows.length || rows[i].date !== rows[start].date) {
        groups.push({
          start,
          end: i - 1,
          dateText: rows[start].dateText,
          left: start === 0 ? 0 : x(start),
          right: i === rows.length ? W : x(i)
        });
        start = i;
      }
    }

    return groups;
  }

  function drawDayBands(rows, x, plot, W, H) {
    const groups = getDateGroups(rows, x, W);
    if (!groups.length) return;

    ctx.font = "11px system-ui, -apple-system, Segoe UI, sans-serif";
    ctx.textBaseline = "top";

    groups.forEach((g, gi) => {
      if (gi === 0) return;
      const xx = g.left;

      ctx.strokeStyle = getCss("--midnight");
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 5]);
      ctx.beginPath();
      ctx.moveTo(xx, plot.top - 8);
      ctx.lineTo(xx, plot.top + plot.height + 12);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = getCss("--muted");
      ctx.textAlign = "right";
      ctx.fillText(groups[gi - 1].dateText, xx - 6, plot.top + 4);
      ctx.textAlign = "left";
      ctx.fillText(g.dateText, xx + 6, plot.top + 4);
    });

    updateFloatingDates(rows, x, W);
  }

  function updateFloatingDates(rows, x, W) {
    if (!floatingDatesEl || !rows.length) return;

    const groups = getDateGroups(rows, x, W);
    const viewLeft = scrollBox.scrollLeft;
    const viewRight = viewLeft + scrollBox.clientWidth;
    const minPad = 44;
    const maxPad = 44;

    floatingDatesEl.innerHTML = "";

    groups.forEach(g => {
      const visibleLeft = Math.max(g.left, viewLeft);
      const visibleRight = Math.min(g.right, viewRight);

      if (visibleRight <= visibleLeft) return;

      const labelXInCanvas = clamp((visibleLeft + visibleRight) / 2, g.left + minPad, g.right - maxPad);
      const labelXInView = labelXInCanvas - viewLeft;

      const el = document.createElement("div");
      el.className = "floating-date";
      el.textContent = g.dateText;
      el.style.left = `${labelXInView}px`;
      floatingDatesEl.appendChild(el);
    });
  }

  function clamp(v, lo, hi) {
    if (lo > hi) return (lo + hi) / 2;
    return Math.min(Math.max(v, lo), hi);
  }

  function midpoint(a, b) {
    return (a + b) / 2;
  }

  function roundRect(ctx, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.lineTo(x + w - rr, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
    ctx.lineTo(x + w, y + h - rr);
    ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    ctx.lineTo(x + rr, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
    ctx.lineTo(x, y + rr);
    ctx.quadraticCurveTo(x, y, x + rr, y);
  }

  function drawCurrentTags(tagX, plot, W, H, padR) {
    const tagW = 42, tagH = 16, tagR = 8;

    const drawCurrentTag = (tagY) => {
      const tagLeft = Math.max(
        2,
        Math.min(W - padR - tagW - 2, tagX - tagW / 2)
      );

      roundRect(ctx, tagLeft, tagY, tagW, tagH, tagR);
      ctx.fillStyle = "rgba(18,26,48,.96)";
      ctx.fill();
      ctx.strokeStyle = getCss("--avg");
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = getCss("--text");
      ctx.font = "10px system-ui, -apple-system, Segoe UI, sans-serif";
      ctx.textBaseline = "middle";
      ctx.textAlign = "center";
      ctx.fillText("(현재)", tagLeft + tagW / 2, tagY + tagH / 2);
    };

    drawCurrentTag(Math.max(4, plot.top - tagH - 8));
    drawCurrentTag(H - plot.bottom + 30);
  }

  function drawLine(rows, getter, color, x, y, yMax) {
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    let started = false;
    rows.forEach((r, i) => {
      const v = getter(r);
      if (!Number.isFinite(v)) return;
      if (!started) { ctx.moveTo(x(i), y(v)); started = true; }
      else ctx.lineTo(x(i), y(v));
    });
    ctx.stroke();

    rows.forEach((r, i) => {
      const v = getter(r);
      if (!Number.isFinite(v)) return;
      ctx.beginPath();
      ctx.arc(x(i), y(v), 3.0, 0, Math.PI * 2);
      if (v > yMax) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      } else {
        ctx.fill();
      }
    });
  }

  function renderDailyReport(rows) {
    const el = document.getElementById("dailyReport");
    if (!el) return;

    const byDate = {};
    for (const r of rows) {
      if (r.hour < 8 || r.hour > 18) continue;
      if (!byDate[r.date]) byDate[r.date] = { dateText: r.dateText, rows: [] };
      byDate[r.date].rows.push(r);
    }

    const dates = Object.keys(byDate).sort();
    if (!dates.length) { el.innerHTML = ""; return; }

    const nowDate = keyOfLocalHour(roundHourKST()).slice(0, 10);
    const rows_html = dates.map(date => {
      const { dateText, rows: dr } = byDate[date];
      const validAvg = dr.filter(r => Number.isFinite(r.avg));
      const validMax = dr.filter(r => Number.isFinite(r.max));
      if (!validAvg.length) return "";

      const minAvgRow = validAvg.reduce((a, b) => a.avg < b.avg ? a : b);
      const minMaxRow = validMax.length ? validMax.reduce((a, b) => a.max < b.max ? a : b) : null;
      const isPast = date < nowDate;
      const isToday = date === nowDate;
      const avgRain = minAvgRow.isRain ? '<span class="rain-note">비</span>' : '';
      const maxRain = minMaxRow?.isRain ? '<span class="rain-note">비</span>' : '';

      return `<tr${isToday ? ' class="today-row"' : ''}${isPast ? ' style="opacity:.5"' : ''}>
        <td class="date-col">${dateText}</td>
        <td class="avg-col">${minAvgRow.avg.toFixed(1)}</td>
        <td class="time-col">${String(minAvgRow.hour).padStart(2,"0")}시${avgRain}</td>
        <td class="max-col">${minMaxRow ? minMaxRow.max.toFixed(1) : "--"}</td>
        <td class="time-col">${minMaxRow ? String(minMaxRow.hour).padStart(2,"0") + "시" + maxRain : "--"}</td>
      </tr>`;
    }).join("");

    el.innerHTML = `<div style="color:var(--text);font-size:15px;font-weight:750;margin-bottom:8px;">
      비행 권장시간 <span style="color:var(--muted);font-size:12px;font-weight:500;">(08시 ~ 18시 기준)</span>
    </div>
    <table>
      <colgroup>
        <col style="width:20%">
        <col style="width:20%">
        <col style="width:18%">
        <col style="width:24%">
        <col style="width:18%">
      </colgroup>
      <thead><tr>
        <th style="text-align:left">날짜</th>
        <th><span class="head-break">최저</span>평균풍속</th><th class="time-head">시각</th>
        <th><span class="head-break">최저</span>최대풍속</th><th class="time-head">시각</th>
      </tr></thead>
      <tbody>${rows_html}</tbody>
    </table>`;
  }

  function updateCalmLabel() {
    const el = document.getElementById("calmLabel");
    if (!el || !axisCanvas._calmY) return;
    const axisRect = axisCanvas.closest(".axis-box").getBoundingClientRect();
    const wrapRect = el.closest(".chart-wrap").getBoundingClientRect();
    const offsetTop = axisRect.top - wrapRect.top;
    el.style.top = (offsetTop + axisCanvas._calmY + 4) + "px";
  }

  function getCss(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function updateControlsAvailability() {
    for (const source of SOURCES) {
      const chip = document.getElementById(`chip-${source.id}`);
      const input = document.getElementById(`model-${source.id}`);
      const ok = availableIds.has(source.id);

      input.disabled = !ok;
      chip.classList.toggle("unavailable", !ok);

      if (!ok) {
        input.checked = false;
        selectedIds.delete(source.id);
      } else {
        input.checked = selectedIds.has(source.id);
      }
    }
    saveSelectedIds();
  }

  function renderFromSelection() {
    const selectedResults = [...selectedIds]
      .filter(id => availableIds.has(id))
      .map(id => fetched[id]);

    if (!selectedResults.length) {
      if (avgNowEl) avgNowEl.textContent = "--";
      if (maxNowEl) maxNowEl.textContent = "--";
      statusEl.className = "status warning";
      statusEl.textContent = "최소 1개 이상의 예보모델을 선택해야 합니다.";
      lastRows = [];
      draw([]);
      return;
    }

    const rows = aggregate(selectedResults);
    lastRows = rows;

    const first = rows[0] || {};
    if (avgNowEl) avgNowEl.textContent = fmt(first.avg);
    if (maxNowEl) maxNowEl.textContent = fmt(first.max);
    draw(rows);
    renderDailyReport(rows);

    const now = new Date();
    const time = now.toLocaleString("ko-KR", { hour12: false });
    statusEl.className = "status";
    statusEl.textContent = `갱신 ${time} · ${rows.length}시간 예보 · 선택 모델 ${selectedResults.map(x => x.name).join(", ")}`;
  }

  async function refresh() {
    statusEl.className = "status";
    statusEl.textContent = "불러오는 중...";
    document.getElementById("refresh").disabled = true;

    const currentScroll = scrollBox.scrollLeft;
    const settled = await Promise.allSettled(SOURCES.map(fetchSource));

    fetched = {};
    availableIds = new Set();

    const fail = [];

    for (let i = 0; i < settled.length; i++) {
      const source = SOURCES[i];
      const result = settled[i];
      if (result.status === "fulfilled") {
        fetched[source.id] = result.value;
        availableIds.add(source.id);
      } else {
        fail.push(source.name);
      }
    }

    if (!availableIds.size) {
      if (avgNowEl) avgNowEl.textContent = "--";
      if (maxNowEl) maxNowEl.textContent = "--";
      statusEl.className = "status warning";
      statusEl.textContent = "풍속 데이터를 불러오지 못했습니다.";
      document.getElementById("refresh").disabled = false;
      updateControlsAvailability();
      return;
    }

    if (![...selectedIds].some(id => availableIds.has(id))) {
      selectedIds = new Set([...availableIds]);
    }

    updateControlsAvailability();
    renderFromSelection();

    if (firstLoad) {
      firstLoad = false;
      const hourWidth = window.innerWidth < 640 ? 16 : 18;
      const currentIdx = lastRows ? lastRows.findIndex(r => r.isCurrent) : -1;
      if (currentIdx > 0) {
        scrollBox.scrollLeft = Math.max(0, currentIdx * hourWidth - 60);
      }
    } else {
      scrollBox.scrollLeft = currentScroll;
    }

    if (fail.length) {
      statusEl.textContent += ` · 불러오기 실패: ${fail.join(", ")}`;
    }

    document.getElementById("refresh").disabled = false;
  }

  document.getElementById("refresh").addEventListener("click", refresh);
  scrollBox.addEventListener("scroll", () => {
    if (lastRows) draw(lastRows);
  }, { passive: true });
  window.addEventListener("resize", () => {
    if (lastRows) draw(lastRows);
    else {
      drawAxis(lastYMax);
    }
  });

  refresh();
  setInterval(refresh, 10 * 60 * 1000);
})();
</script>
</body>
